name: Assemble HTML

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Concatenate parts into HTML
        run: |
          set -euo pipefail
          if [ -d parts ]; then
            cat parts/part*.txt > index.html
            cp index.html local-automation-map.html
          fi
      - name: Commit assembled files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html local-automation-map.html
          if git diff --cached --quiet; then
            echo "No HTML changes"
            exit 0
          fi
          git commit -m "Assemble HTML page from parts"
          git push
